<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        /* css at-rule */
        @font-face {
            font-family: 'Love';
            src: url('fonts/Cherish Free.otf') format('opentype'), url('fonts/Cherish Free.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /*
            format() types
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            - svg
            */
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Debitis, sed labore nam sequi non hic, atque molestias, a sapiente beatae iste eligendi nisi aliquid dignissimos consequuntur odit ipsam temporibus cumque?</p>
</body>
</html>
