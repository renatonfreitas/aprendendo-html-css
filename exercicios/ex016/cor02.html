<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * { /* Configurações globais das CSS */
            height: 100%; /* faz a direção 'to top' e 'to bottom' cobrir a página inteira */
        }

        body {
            /* linear/radial  -gradient*/
            background-image: linear-gradient(to right, #525CCF 30%, #9236A1 50% , #C43E76 70%, #EE7536, #FED271 ); /* direção (escrito ou ângulo), de, **fase ,para*/
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>

</html>
